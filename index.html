<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/iconmonstr-coin-thin.svg" type="image/coin-icon">
    <script src="script.js" defer></script>
</head>

<body>
    <section id="headings">
        <h1>Personal Finance</h1>
        <h2>Track your money in one place</h2>
    </section>

    <section id="transactions">

        <div class="container">
            <h3>Income</h3>
            <h3>Expenses</h3>
            <h3>Net Worth</h3>
        </div>

        <h3>Recent Transactions</h3>
        <div id="transaction-list"></div>
    </section>

    <section id="add-transaction">
        <form id="add-transaction-form">
            <label for="merchant">Merchant</label>
            <input 
                id="merchant"
                type="text"
                placeholder="e.g. Kroger"
            >

            <label for="date">Date</label>
            <input
                id="date"
                type="date"
                required
            >

            <label for="amount">Amount</label>
            <input 
                id="amount"
                type="number"
                placeholder="e.g. 43.09"
                step="0.01"
            >

            <label for="category-dropdown">Category</label>
            <select id="category-dropdown" name="category">
                <option value="transportation">Car Payment</option>
                <option value="groceries">Groceries</option>
                <option value="rent">Rent</option>
                <option value="subscriptions">Subscriptions</option>
            </select>

            <label for="expense">Expense</label>
            <input
                id="expense"
                type="radio"
                name="type"
                value="expense"
                checked="true"
            >

            <label for="income">Income</label>
            <input
                id="income"
                type="radio"
                name="type"
                value="income"
            >

            <label for="account">Account</label>
            <select id="account-dropdown" name="account">
                <option value="checking">Checking</option>
                <option value="savings">Savings</option>
            </select>

            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" placeholder="optional"></textarea>

            <label for="tag">Tag</label>
            <input
                id="tag"
                type="text"
                placeholder="e.g. groceries"
            >

            <button type="submit">Add Transaction</button>
        </form>
    </section>
</body>

</html>
